# Sharlock default detection rules
# Schema:
#   id:       snake_case unique identifier
#   title:    human label shown in report
#   severity: info | warn | critical
#   condition:
#     path:   dot-separated path into parsed data; * expands over dict keys
#     op:     gt | lt | gte | lte | eq | neq | exists | not_exists
#     value:  compared against resolved path value(s) (omit for exists/not_exists)

rules:
  - id: red_cluster
    title: "Cluster status is RED"
    severity: critical
    condition:
      path: cluster_health.status
      op: eq
      value: "red"

  - id: yellow_cluster
    title: "Cluster status is YELLOW"
    severity: warn
    condition:
      path: cluster_health.status
      op: eq
      value: "yellow"

  - id: unassigned_shards
    title: "Unassigned shards detected"
    severity: warn
    condition:
      path: cluster_health.unassigned_shards
      op: gt
      value: 0

  - id: high_heap
    title: "JVM heap usage > 85% on one or more nodes"
    severity: warn
    condition:
      path: nodes_stats.nodes.*.jvm.mem.heap_used_percent
      op: gt
      value: 85

  - id: disk_low
    title: "Available disk < 10 GB on one or more nodes"
    severity: critical
    condition:
      path: nodes_stats.nodes.*.fs.total.available_in_bytes
      op: lt
      value: 10737418240

  - id: pending_tasks
    title: "Cluster has pending tasks"
    severity: info
    condition:
      path: pending_tasks.tasks
      op: exists

  - id: write_threadpool_rejections
    title: "Write thread pool rejections detected on one or more nodes"
    severity: warn
    condition:
      path: nodes_stats.nodes.*.thread_pool.write.rejected
      op: gt
      value: 0

  - id: search_threadpool_rejections
    title: "Search thread pool rejections detected on one or more nodes"
    severity: warn
    condition:
      path: nodes_stats.nodes.*.thread_pool.search.rejected
      op: gt
      value: 0

  - id: timed_out_cluster_health
    title: "Cluster health check timed out"
    severity: warn
    condition:
      path: cluster_health.timed_out
      op: eq
      value: true

  - id: ilm_step_error
    title: "Index stuck in ILM ERROR step"
    severity: critical
    condition:
      path: ilm_explain.indices.*.step
      op: eq
      value: "ERROR"

  - id: ilm_policy_missing
    title: "ILM policy referenced but not defined"
    severity: warn
    condition:
      path: ilm_explain.indices.*.policy
      op: ref_not_in
      ref: ilm_policies

  - id: ilm_paused
    title: "ILM is paused cluster-wide"
    severity: warn
    condition:
      path: ilm_status.operation_mode
      op: eq
      value: "STOPPED"

  - id: high_segment_count
    title: "Index has > 30 segments (merge pressure)"
    severity: warn
    condition:
      path: indices_stats.indices.*.primaries.segments.count
      op: gt
      value: 30

  - id: bulk_rejections
    title: "Bulk thread pool rejections on one or more nodes"
    severity: critical
    condition:
      path: nodes_stats.nodes.*.thread_pool.bulk.rejected
      op: gt
      value: 0

  - id: ingest_failures
    title: "Ingest pipeline failures on one or more nodes"
    severity: warn
    condition:
      path: nodes_stats.nodes.*.ingest.total.failed
      op: gt
      value: 0

  - id: fielddata_evictions
    title: "Fielddata evictions detected — possible heap pressure"
    severity: warn
    condition:
      path: fielddata_stats.nodes.*.indices.fielddata.evictions
      op: gt
      value: 0

  - id: dangling_indices
    title: "Dangling indices present on cluster"
    severity: info
    condition:
      path: dangling_indices.dangling_indices
      op: exists

  - id: deprecation_warnings
    title: "Deprecation warnings present — review before upgrading"
    severity: info
    condition:
      path: deprecation_info.index_settings
      op: exists
